# ============================================================
# HTTP: همه به HTTPS non-www ریدایرکت بشن
# ============================================================
server {
    listen 80;
    server_name aasgari.ir www.aasgari.ir;
    return 301 https://aasgari.ir$request_uri;
}

# ============================================================
# HTTPS: www.aasgari.ir → aasgari.ir
# ============================================================
server {
    listen 443 ssl;
    server_name www.aasgari.ir;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    return 301 https://aasgari.ir$request_uri;
}

# ============================================================
# Cache zone برای SSR
# ============================================================
proxy_cache_path /var/cache/nginx/ssr levels=1:2 keys_zone=ssr_cache:10m max_size=500m inactive=60m use_temp_path=off;

# ============================================================
# HTTPS: دامنه اصلی (aasgari.ir)
# ============================================================
server {
    listen 443 ssl;
    server_name aasgari.ir;

    client_max_body_size 20M;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ===== سرو فایل‌های استاتیک =====
    location /assets/ {
        alias /var/www/online-shop/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ===== API (بدون کش) =====
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 20M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ===== Admin و صفحات خصوصی (بدون کش) =====
    location ~ ^/(admin|cart|payment|profile|wishlist|login|register|support/tickets) {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ===== آپلود =====
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== SSR با کش =====
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ✅ تنظیمات کش SSR
        proxy_cache ssr_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 301 302 1h;
        proxy_cache_valid 404 1m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_methods GET HEAD;

        # ✅ نادیده گرفتن هدر private از سرور، تا nginx همچنان کش کنه
        proxy_ignore_headers Cache-Control Expires Set-Cookie;

        proxy_cache_bypass $cookie_token;
        proxy_no_cache $cookie_token;

        # هدر برای دیباگ
        add_header X-Cache-Status $upstream_cache_status always;
    }
}